[package]
name = "ptp-host"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.104"
arboard = "3.7.0"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
dirs = "7.0.0"
eframe = "0.36"
egui-phosphor = "0.14"
futures-util = "0.3.34"
opus = "0.4"
rand = "0.10.4"
rtc = "0.21.1"
secp256k1 = { version = "0.33", features = ["global-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.21"

[build-dependencies]
cc = "1.11.2"
