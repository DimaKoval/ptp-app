[package]
name = "ptp-host"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.104"
arboard = "3.7.0"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
dirs = "7.0.0"
eframe = "0.36"
egui-phosphor = "0.14"
futures-util = "0.3.34"
opus = "0.4"
rand = "0.10.4"
rtc = "0.21.1"
secp256k1 = { version = "0.33", features = ["global-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.21"

[build-dependencies]
cc = "1.11.2"
winresource = "0.1"

[[bin]]
name = "ptp-share"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }


[profile.release]
strip = true
